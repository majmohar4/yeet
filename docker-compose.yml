# yeet — docker-compose.yml
# Usage: docker compose up -d
# Copy .env.example to .env and fill in SECRET_KEY before starting.
#
# ClamAV is installed directly inside the yeet container, so it works on
# both ARM64 (Apple Silicon M1/M2/M3) and x86_64 without a separate service.

services:

  # ── Application ──────────────────────────────────────────────────────────────
  yeet:
    build: .
    restart: unless-stopped
    container_name: yeet
    ports:
      - "127.0.0.1:4534:8000"     # bind localhost only — expose via reverse proxy
    volumes:
      # Uploads, SQLite DB, config.json and ClamAV signatures. Set YEET_DATA_DIR in
      # .env to put them on a big disk. Use a plain filesystem with real free
      # space: pooled mounts (mergerfs with minfreespace) can refuse new files
      # while `df` still reports space.
      - ${YEET_DATA_DIR:-./data}:/data
    env_file:
      - .env                       # SECRET_KEY, ADMIN_PASSWORD, overrides
    environment:
      - ADMIN_PASSWORD             # pass-through from host shell (used by test runner)
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M            # clamd needs ~1GB while running (on demand, see CLAMAV_IDLE_MINUTES)
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s           # First start downloads ClamAV definitions (~2 min)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
